name: Markdown Lint

on:
  push:
    paths:
      - "**/*.md"
      - ".github/workflows/markdown-lint.yml"
      - ".markdownlint.yaml"
  pull_request:
    paths:
      - "**/*.md"
      - ".github/workflows/markdown-lint.yml"
      - ".markdownlint.yaml"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v17
        with:
          globs: "**/*.md"

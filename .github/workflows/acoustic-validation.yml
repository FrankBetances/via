name: Acoustic Validation

# Contrasta el análisis acústico de VIA+ con Praat (parselmouth) sobre señales
# sintéticas deterministas. Corre en build-time: ningún modelo ni librería de
# análisis entra en el dispositivo (ver tools/acoustics/README.md).
#
# Falla si algún parámetro se desvía por encima de su tolerancia declarada, de
# modo que una regresión del DSP se detecta aquí y no en la consulta.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/Screens/VoiceAnalysis/**"
      - "tools/acoustics/**"
      - ".github/workflows/acoustic-validation.yml"
  push:
    branches: [main]
    paths:
      - "src/Screens/VoiceAnalysis/**"
      - "tools/acoustics/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install JS dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Praat bindings
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/acoustics/requirements.txt

      - name: Generate fixtures (app DSP)
        run: node tools/acoustics/fixtures.js

      - name: Compare against Praat
        run: python3 tools/acoustics/validate.py --json acoustic-report.json

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acoustic-validation-report
          path: |
            acoustic-report.json
            tools/acoustics/out/via-measurements.json
          retention-days: 30

name: Generate Voice Assets

# Sintetiza los assets del CORPUS GENERAL de voz (consignas) con las voces
# neuronales abiertas (Piper es/es-DO · Celtia gl del Proxecto Nós) y los
# commitea a la rama de trabajo. Los modelos de IA corren SOLO aquí
# (build-time); la app nunca incorpora IA en runtime (offline-first, P1).
#
# `main` está protegida: los assets se integran por PR, nunca con push directo.
# Ver docs/design/arquitectura-corpus-voz.md.

on:
  workflow_dispatch:
    inputs:
      lang:
        description: "Idioma a sintetizar"
        type: choice
        options: ["all", "es", "gl", "eu", "es-DO"]
        default: "all"
      target:
        description: "Qué sintetizar: consignas (corpus general), recortes de la audiometría verbal, o ambos"
        type: choice
        options: ["ambos", "corpus", "verbal"]
        default: "ambos"
      eu_repo:
        description: "Repositorio de los pesos de la voz vasca Maider (solo si se sintetiza eu). Si se deja vacío se usa la variable NOS_EU_REPO del repositorio."
        type: string
        default: ""
      engine:
        description: "Motor de voz (neural = calidad; espeak = degradación sin pesos, no cubre gl)"
        type: choice
        options: ["neural", "espeak"]
        default: "neural"
  push:
    branches:
      - "claude/**"
    paths:
      - "voice-corpus.json"
      - "src/Voice/viaVoiceConsignas.ts"
      - "src/Voice/viaVoiceCorpus.ts"
      - "scripts/export-voice-corpus.js"
      - "scripts/synthesize-voice-corpus.js"
      - "scripts/build-voice-asset-map.js"
      - "tools/nos/**"
      - ".github/workflows/voice-assets.yml"

# Un solo run por rama; los encadenados esperan (evita carreras al commitear).
concurrency:
  group: voice-assets-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  synthesize:
    runs-on: ubuntu-latest
    # Anti-bucle: ignora los commits del propio bot (marcados [voice-assets]).
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[voice-assets]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install JS dependencies
        run: npm ci --legacy-peer-deps

      # ffmpeg es imprescindible (post-proceso de sonoridad); espeak-ng SOLO
      # hace falta con el motor de degradación. Se instala únicamente lo que
      # falte: los runners de GitHub ya traen ffmpeg en la imagen, así que en
      # el caso normal este paso no toca apt.
      #
      # Cuando sí hay que instalar, se hace de forma no interactiva y ESPERANDO
      # el lock de dpkg de manera acotada: un run se quedó 18 minutos colgado
      # aquí porque `unattended-upgrades` tenía el lock tomado y `apt-get` se
      # queda esperando indefinidamente, sin salida ni aviso. Con `timeout` el
      # paso falla rápido y con un mensaje, en vez de agotar el job entero.
      - name: Install audio tooling (ffmpeg, y espeak-ng si se usa)
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          NEED=""
          command -v ffmpeg >/dev/null || NEED="$NEED ffmpeg"
          if [ "${{ github.event.inputs.engine || 'neural' }}" = "espeak" ]; then
            command -v espeak-ng >/dev/null || NEED="$NEED espeak-ng"
          fi
          if [ -z "$NEED" ]; then
            echo "Nada que instalar (ffmpeg $(ffmpeg -version 2>/dev/null | head -1))."
            exit 0
          fi

          echo "Instalando:$NEED"
          # Espera acotada a que se suelte el lock de apt/dpkg.
          for i in $(seq 1 30); do
            if ! sudo fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1; then break; fi
            echo "  dpkg bloqueado por otro proceso (intento $i/30)…"; sleep 10
          done
          timeout 300 sudo -E apt-get update -qq \
            || { echo "::error::apt-get update no terminó en 5 min"; exit 1; }
          # shellcheck disable=SC2086
          timeout 600 sudo -E apt-get install -y --no-install-recommends $NEED \
            || { echo "::error::apt-get install no terminó en 10 min"; exit 1; }

      - name: Resolve target languages
        id: langs
        run: |
          ENGINE="${{ github.event.inputs.engine || 'neural' }}"
          LANG_IN="${{ github.event.inputs.lang || 'all' }}"
          if [ "$LANG_IN" = "all" ]; then
            LANGS="es gl eu es-DO"
          else
            LANGS="$LANG_IN"
          fi
          # espeak no cubre gl: se descarta con aviso (requiere motor neural).
          if [ "$ENGINE" = "espeak" ]; then
            LANGS="$(echo "$LANGS" | tr ' ' '\n' | grep -v '^gl$' | tr '\n' ' ')"
            echo "::warning::Motor espeak: 'gl' omitido (sin voz espeak-ng; requiere Celtia neural)."
          fi
          echo "engine=$ENGINE" >> "$GITHUB_OUTPUT"
          echo "langs=$LANGS" >> "$GITHUB_OUTPUT"
          echo "target=${{ github.event.inputs.target || 'ambos' }}" >> "$GITHUB_OUTPUT"

      - name: Install neural engine + fetch models
        if: ${{ steps.langs.outputs.engine == 'neural' }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          # Voz vasca Maider: su repositorio de pesos no está fijado en
          # voices.json (ver sus `notes`), así que se resuelve desde aquí.
          NOS_EU_REPO: ${{ github.event.inputs.eu_repo || vars.NOS_EU_REPO }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::HF_TOKEN no configurado. La voz neural (Celtia gl es 'gated') requiere el secret HF_TOKEN. Añádelo en Settings → Secrets, o usa engine=espeak (es/es-DO)."
            exit 1
          fi
          python -m pip install --upgrade pip
          pip install -r tools/nos/requirements.txt
          # Verifica que las librerías IMPORTAN, no solo que estén instaladas:
          # una resolución transitiva incompatible (p. ej. spacy sin `click`)
          # deja `import TTS` roto y la síntesis gallega fallaba a mitad del
          # job, tras descargar los pesos.
          python tools/nos/tts.py --check
          HUGGING_FACE_HUB_TOKEN="$HF_TOKEN" tools/nos/fetch-models.sh

      - name: Export corpus
        run: node scripts/export-voice-corpus.js

      - name: Synthesize corpus assets (incremental)
        if: ${{ steps.langs.outputs.target != 'verbal' }}
        env:
          VOICE_TTS: ${{ steps.langs.outputs.engine == 'espeak' && 'espeak' || '' }}
        run: |
          for L in ${{ steps.langs.outputs.langs }}; do
            echo "── síntesis $L ──"
            node scripts/synthesize-voice-corpus.js --lang "$L"
          done

      # Recortes de la AUDIOMETRÍA VERBAL. Son un banco distinto del corpus de
      # consignas: `gl` y `eu` no tienen locuciones propias, así que la prueba
      # degrada a la voz del sistema del dispositivo (en euskera, a la
      # castellana) — que es exactamente el «en gallego no hay nada» reportado
      # en campo. Este paso es el que las genera.
      - name: Synthesize verbal audiometry clips
        if: ${{ steps.langs.outputs.target != 'corpus' }}
        env:
          VERBAL_TTS: ${{ steps.langs.outputs.engine == 'espeak' && 'espeak' || 'neural' }}
          NOS_EU_REPO: ${{ github.event.inputs.eu_repo || vars.NOS_EU_REPO }}
        run: |
          for L in ${{ steps.langs.outputs.langs }}; do
            echo "── recortes verbales $L ──"
            node scripts/verbal-assets.js audio    --lang "$L"
            node scripts/verbal-assets.js registry --lang "$L"
            node scripts/verbal-assets.js manifest --lang "$L"
          done

      - name: Rebuild asset map
        if: ${{ steps.langs.outputs.target != 'verbal' }}
        run: node scripts/build-voice-asset-map.js

      - name: Commit assets to the working branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/voice src/Voice/viaVoiceAssets.ts voice-corpus.json \
                  assets/audio/verbal assets/verbal-manifest*.json \
                  src/Screens/VerbalAudiometry/verbalAudioClips*.ts
          if git diff --cached --quiet; then
            echo "Sin cambios de assets (incremental: todo ya sintetizado)."
            exit 0
          fi
          git commit -m "chore(voice): assets de voz (corpus y/o recortes verbales) [voice-assets]"
          # Push robusto ante concurrencia: rebase sobre la rama y reintenta.
          for i in 1 2 3 4 5; do
            git pull --rebase origin "${{ github.ref_name }}" && \
              git push origin "HEAD:${{ github.ref_name }}" && exit 0
            echo "push falló (intento $i), reintentando…"; sleep $((i * 3))
          done
          echo "::error::No se pudieron subir los assets tras varios reintentos."; exit 1

name: Generate Voice Assets

# Sintetiza los assets del CORPUS GENERAL de voz (consignas) con las voces
# neuronales abiertas (Piper es/es-DO · Celtia gl del Proxecto Nós) y los
# commitea a la rama de trabajo. Los modelos de IA corren SOLO aquí
# (build-time); la app nunca incorpora IA en runtime (offline-first, P1).
#
# `main` está protegida: los assets se integran por PR, nunca con push directo.
# Ver docs/design/arquitectura-corpus-voz.md.

on:
  workflow_dispatch:
    inputs:
      lang:
        description: "Idioma a sintetizar"
        type: choice
        options: ["all", "es", "gl", "eu", "es-DO"]
        default: "all"
      target:
        description: "Qué sintetizar: consignas (corpus general), recortes de la audiometría verbal, o ambos"
        type: choice
        options: ["ambos", "corpus", "verbal"]
        default: "ambos"
      engine:
        description: "Motor de voz (neural = calidad; espeak = degradación sin pesos, no cubre gl)"
        type: choice
        options: ["neural", "espeak"]
        default: "neural"
  push:
    branches:
      - "claude/**"
    paths:
      - "voice-corpus.json"
      - "src/Voice/viaVoiceConsignas.ts"
      - "src/Voice/viaVoiceCorpus.ts"
      - "scripts/export-voice-corpus.js"
      - "scripts/synthesize-voice-corpus.js"
      - "scripts/build-voice-asset-map.js"
      - "scripts/verbal-assets.js"
      - "scripts/voice-clip-tempo.js"
      - "tools/nos/**"
      - ".github/workflows/voice-assets.yml"

# Un solo run por rama; los encadenados esperan (evita carreras al commitear).
concurrency:
  group: voice-assets-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  synthesize:
    runs-on: ubuntu-latest
    # Anti-bucle: ignora los commits del propio bot (marcados [voice-assets]).
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[voice-assets]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install JS dependencies
        run: npm ci --legacy-peer-deps

      # ffmpeg es imprescindible (post-proceso de sonoridad); espeak-ng SOLO
      # hace falta con el motor de degradación. Se instala únicamente lo que
      # falte: los runners de GitHub ya traen ffmpeg en la imagen, así que en
      # el caso normal este paso no toca apt.
      #
      # Cuando sí hay que instalar, se hace de forma no interactiva y ESPERANDO
      # el lock de dpkg de manera acotada: un run se quedó 18 minutos colgado
      # aquí porque `unattended-upgrades` tenía el lock tomado y `apt-get` se
      # queda esperando indefinidamente, sin salida ni aviso. Con `timeout` el
      # paso falla rápido y con un mensaje, en vez de agotar el job entero.
      - name: Install audio tooling (ffmpeg, y espeak-ng si se usa)
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          NEED=""
          command -v ffmpeg >/dev/null || NEED="$NEED ffmpeg"
          if [ "${{ github.event.inputs.engine || 'neural' }}" = "espeak" ]; then
            command -v espeak-ng >/dev/null || NEED="$NEED espeak-ng"
          fi
          if [ -z "$NEED" ]; then
            echo "Nada que instalar (ffmpeg $(ffmpeg -version 2>/dev/null | head -1))."
            exit 0
          fi

          echo "Instalando:$NEED"
          # Espera acotada a que se suelte el lock de apt/dpkg.
          for i in $(seq 1 30); do
            if ! sudo fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1; then break; fi
            echo "  dpkg bloqueado por otro proceso (intento $i/30)…"; sleep 10
          done
          timeout 300 sudo -E apt-get update -qq \
            || { echo "::error::apt-get update no terminó en 5 min"; exit 1; }
          # Reintento con espera: el fallo real no fue un cuelgue sino un mirror
          # lento — `ffmpeg` arrastra 87 paquetes (173 MB) y azure.archive venía
          # a minutos por paquete, así que el corte de 10 min saltó a mitad de
          # descarga y se llevó el job entero antes de sintetizar nada. apt
          # conserva lo ya descargado en /var/cache/apt, de modo que el segundo
          # intento reanuda en vez de empezar de cero.
          # shellcheck disable=SC2086
          for i in 1 2 3; do
            timeout 600 sudo -E apt-get install -y --no-install-recommends $NEED && break
            if [ "$i" = 3 ]; then
              echo "::error::apt-get install no terminó tras 3 intentos de 10 min"
              exit 1
            fi
            echo "  descarga lenta o interrumpida (intento $i/3), reintentando…"; sleep $((i * 15))
          done

      - name: Resolve target languages
        id: langs
        run: |
          ENGINE="${{ github.event.inputs.engine || 'neural' }}"
          LANG_IN="${{ github.event.inputs.lang || 'all' }}"
          if [ "$LANG_IN" = "all" ]; then
            LANGS="es gl eu es-DO"
          else
            LANGS="$LANG_IN"
          fi
          # espeak no cubre gl: se descarta con aviso (requiere motor neural).
          if [ "$ENGINE" = "espeak" ]; then
            LANGS="$(echo "$LANGS" | tr ' ' '\n' | grep -v '^gl$' | tr '\n' ' ')"
            echo "::warning::Motor espeak: 'gl' omitido (sin voz espeak-ng; requiere Celtia neural)."
          fi
          echo "engine=$ENGINE" >> "$GITHUB_OUTPUT"
          echo "langs=$LANGS" >> "$GITHUB_OUTPUT"
          echo "target=${{ github.event.inputs.target || 'ambos' }}" >> "$GITHUB_OUTPUT"

      - name: Install neural engine + fetch models
        if: ${{ steps.langs.outputs.engine == 'neural' }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::HF_TOKEN no configurado. La voz neural (Celtia gl es 'gated') requiere el secret HF_TOKEN. Añádelo en Settings → Secrets, o usa engine=espeak (es/es-DO)."
            exit 1
          fi
          python -m pip install --upgrade pip
          pip install -r tools/nos/requirements.txt
          # Verifica que las librerías IMPORTAN, no solo que estén instaladas:
          # una resolución transitiva incompatible (p. ej. spacy sin `click`)
          # deja `import TTS` roto y la síntesis gallega fallaba a mitad del
          # job, tras descargar los pesos.
          python tools/nos/tts.py --check
          HUGGING_FACE_HUB_TOKEN="$HF_TOKEN" tools/nos/fetch-models.sh

      # AhoTTS (HiTZ/Aholab) aporta el binario `tts`, el frontend lingüístico
      # vasco y el diccionario eu_dicc. La voz Maider se sintetiza A TRAVÉS de
      # ese binario: su vits.onnx espera FONEMAS, no grafemas, así que inferirlo
      # suelto —como sí se hace con Celtia— daría audio inservible. Mismo montaje
      # que en Valeria+, donde esta voz ya está en producción.
      - name: Set up AhoTTS (voz vasca Maider)
        if: ${{ contains(steps.langs.outputs.langs, 'eu') }}
        run: |
          git clone --depth 1 https://github.com/hitz-zentroa/aHoTTS.git "$RUNNER_TEMP/ahotts"
          chmod +x "$RUNNER_TEMP/ahotts/ahotts/tts" || true
          echo "AHOTTS_DIR=$RUNNER_TEMP/ahotts" >> "$GITHUB_ENV"

      - name: Export corpus
        run: node scripts/export-voice-corpus.js

      # TOLERANTE POR IDIOMA (mismo criterio que Valeria+): que una voz falle no
      # debe tirar el lote entero. El resto de idiomas sí se ha sintetizado y
      # hay que commitearlo; el que falta degrada a la voz del sistema, que es
      # una degradación declarada y funcional. Antes, un fallo en el primer
      # idioma del bucle se llevaba por delante el trabajo de los demás — es
      # justo lo que pasó con el gallego.
      - name: Synthesize corpus assets (incremental)
        id: corpus
        if: ${{ steps.langs.outputs.target != 'verbal' }}
        env:
          VOICE_TTS: ${{ steps.langs.outputs.engine == 'espeak' && 'espeak' || '' }}
        run: |
          FAILED=""
          for L in ${{ steps.langs.outputs.langs }}; do
            echo "── consignas · $L ──"
            if ! node scripts/synthesize-voice-corpus.js --lang "$L"; then
              echo "::warning::Consignas '$L': la síntesis falló; ese idioma degrada a la voz del sistema."
              FAILED="$FAILED $L"
            fi
          done
          echo "failed=${FAILED# }" >> "$GITHUB_OUTPUT"

      # Recortes de la AUDIOMETRÍA VERBAL. Son un banco distinto del corpus de
      # consignas: `gl` y `eu` no tienen locuciones propias, así que la prueba
      # degrada a la voz del sistema del dispositivo (en euskera, a la
      # castellana) — que es exactamente el «en gallego no hay nada» reportado
      # en campo. Este paso es el que las genera.
      - name: Synthesize verbal audiometry clips
        id: verbal
        if: ${{ steps.langs.outputs.target != 'corpus' }}
        env:
          VERBAL_TTS: ${{ steps.langs.outputs.engine == 'espeak' && 'espeak' || 'neural' }}
          # La voz vasca descarga su vits.onnx de Hugging Face en tiempo de síntesis.
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          FAILED=""
          for L in ${{ steps.langs.outputs.langs }}; do
            echo "── recortes verbales · $L ──"
            # Los tres pasos van juntos: sin `registry` los .m4a no llegan a la
            # app, así que un idioma cuenta como hecho solo si completa los tres.
            if node scripts/verbal-assets.js audio    --lang "$L" \
            && node scripts/verbal-assets.js registry --lang "$L" \
            && node scripts/verbal-assets.js manifest --lang "$L"; then
              echo "   ✓ $L"
            else
              echo "::warning::Recortes verbales '$L': la síntesis falló; ese idioma dicta con la voz del sistema."
              FAILED="$FAILED $L"
            fi
          done
          echo "failed=${FAILED# }" >> "$GITHUB_OUTPUT"

      # Informativo, NO bloqueante: deja constancia en el log de qué idiomas
      # quedaron locutados. Quien debe bloquear es el empaquetado
      # (`--strict`), donde una voz ausente sí es un defecto: aquí lo único
      # que se pierde es información.
      - name: Verbal clip coverage (informativo)
        if: ${{ steps.langs.outputs.target != 'corpus' }}
        continue-on-error: true
        run: node scripts/check-verbal-coverage.js

      - name: Rebuild asset map
        if: ${{ steps.langs.outputs.target != 'verbal' }}
        run: node scripts/build-voice-asset-map.js

      - name: Commit assets to the working branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/voice src/Voice/viaVoiceAssets.ts voice-corpus.json \
                  assets/audio/verbal assets/verbal-manifest*.json \
                  src/Screens/VerbalAudiometry/verbalAudioClips*.ts
          if git diff --cached --quiet; then
            echo "Sin cambios de assets (incremental: todo ya sintetizado)."
            exit 0
          fi
          git commit -m "chore(voice): assets de voz (corpus y/o recortes verbales) [voice-assets]"
          # Push robusto ante concurrencia: rebase sobre la rama y reintenta.
          for i in 1 2 3 4 5; do
            git pull --rebase origin "${{ github.ref_name }}" && \
              git push origin "HEAD:${{ github.ref_name }}" && exit 0
            echo "push falló (intento $i), reintentando…"; sleep $((i * 3))
          done
          echo "::error::No se pudieron subir los assets tras varios reintentos."; exit 1

      # El job solo se declara fallido si NO se sintetizó nada: con parte del
      # lote hecho, el resultado es un avance real y los avisos de arriba dicen
      # qué idioma se quedó fuera.
      - name: Resumen de la síntesis
        if: always()
        run: |
          CORPUS_FAILED="${{ steps.corpus.outputs.failed }}"
          VERBAL_FAILED="${{ steps.verbal.outputs.failed }}"
          # `if` y no `[ … ] && echo`: los `run:` corren con `bash -e`, donde una
          # lista AND que acaba en falso (variable vacía) aborta el paso.
          if [ -n "$CORPUS_FAILED" ]; then echo "Consignas sin sintetizar: $CORPUS_FAILED"; fi
          if [ -n "$VERBAL_FAILED" ]; then echo "Recortes verbales sin sintetizar: $VERBAL_FAILED"; fi
          PEDIDOS="${{ steps.langs.outputs.langs }}"
          COUNT=$(echo "$PEDIDOS" | wc -w)
          FAILED_COUNT=$(echo "$VERBAL_FAILED $CORPUS_FAILED" | tr ' ' '\n' | sort -u | grep -c . || true)
          if [ "$FAILED_COUNT" -ge "$COUNT" ] && [ "$COUNT" -gt 0 ]; then
            echo "::error::Ningún idioma se sintetizó correctamente."
            exit 1
          fi

          # REGRESIÓN vs. idioma sin locutar. La tolerancia por idioma existe
          # para que una voz que aún no tiene banco no tire el lote de las
          # demás; NO para tapar que un banco YA COMMITEADO haya dejado de
          # regenerarse. Ese caso es el que dejó el castellano atropellado en
          # producción dos veces seguidas: el paso avisaba, el job salía en
          # verde y en el árbol se quedaban los recortes viejos. Si el idioma
          # que falla ya tenía assets, el job falla.
          REGRESION=""
          for L in $(echo "$VERBAL_FAILED" | tr ' ' '\n' | grep -v '^$' || true); do
            DIR="assets/audio/verbal"; [ "$L" = "es" ] || DIR="$DIR/$L"
            if ls "$DIR"/*.m4a >/dev/null 2>&1; then REGRESION="$REGRESION verbal:$L"; fi
          done
          for L in $(echo "$CORPUS_FAILED" | tr ' ' '\n' | grep -v '^$' || true); do
            PREFIX=""; [ "$L" = "es" ] || PREFIX="${L}_"
            if ls "assets/voice/${PREFIX}"*.m4a >/dev/null 2>&1; then REGRESION="$REGRESION corpus:$L"; fi
          done
          if [ -n "$REGRESION" ]; then
            echo "::error::Regresión de assets:${REGRESION}. Ese banco YA estaba locutado y esta corrida no ha conseguido regenerarlo, así que en el árbol siguen los recortes anteriores. Revise el error del paso de síntesis; no lo dé por bueno."
            exit 1
          fi
          echo "Síntesis completada (idiomas pedidos: $PEDIDOS)."

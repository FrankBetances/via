name: Android Release (APK + AAB)

# Un push a `main` COMPILA y pasa las puertas, pero no publica nada. El APK y
# el AAB solo se suben cuando hay una entrega de verdad: un tag `v*` o un
# disparo manual (ver el `if` de los pasos de subida).
#
# El motivo es de almacenamiento. Cada ejecución subía 166 MB (APK 64 + AAB
# 102) y `main` recibe pushes a diario: se acumularon 34 ejecuciones vivas,
# unos 5,6 GB, para dos o tres entregas reales. Lo que se quiere saber en un
# push a `main` es que compila, que firma y que las puertas pasan — y eso se
# sigue sabiendo igual, porque el build entero se ejecuta.
#
# El filtro `paths` de abajo NO se aplica a los pushes de tag (GitHub lo
# ignora para refs de tag), así que un `v*` dispara el workflow aunque el
# commit etiquetado no toque ninguna de esas rutas. Es justo lo que se quiere:
# una entrega no debe depender de qué ficheros llevara el último commit.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "android/**"
      - "src/**"
      - "assets/audio/**"
      - "scripts/check-verbal-coverage.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android-release.yml"
      # La configuración del EMPAQUETADO decide si el bundle de JS se puede
      # construir siquiera, así que un cambio aquí tiene que compilarse. Se
      # añadieron el 23/8/2026 después de arreglar `metro.config.js` y
      # descubrir que el arreglo NO disparó ningún build: el commit no tocaba
      # ninguna de las rutas de arriba, y un fallo de bundle quedó sin
      # comprobar hasta el siguiente cambio en `src/`.
      - "metro.config.js"
      - "babel.config.js"
      - "react-native.config.js"
      - "index.js"
      - "app.json"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # ¿Esta ejecución es una ENTREGA (se publican los binarios) o solo una
      # verificación? Se calcula una vez aquí para que los dos pasos de subida
      # no puedan divergir: si un día se añade un tercer artefacto, hereda el
      # mismo criterio sin que nadie tenga que acordarse de copiar la condición.
      IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install JS dependencies
        run: npm ci --legacy-peer-deps

      # Puerta de locuciones. La síntesis en CI es TOLERANTE a propósito (una
      # voz que falle no debe tirar el lote de las demás), así que sin este
      # chequeo un idioma sin locutar viajaría hasta el APK sin que nadie se
      # entere: la audiometría verbal dictaría con la voz del dispositivo, que
      # no es el estímulo validado.
      #
      # No exige «todos los idiomas al 100 %», sino COHERENCIA con
      # `VERBAL_AUDIO_PENDING`, que es la declaración revisada de qué idiomas
      # se sabe que aún no tienen locuciones propias — y que la pantalla usa
      # para advertir al profesional. Falla en los dos sentidos: recortes que
      # faltan sin estar declarados, y declaraciones que se quedaron obsoletas
      # después de sintetizar.
      #
      # Va ANTES de descifrar el keystore: falla rápido y sin material sensible
      # en el runner.
      - name: Verify verbal clip coverage
        run: node scripts/check-verbal-coverage.js --strict

      # Lúa es de los dos productos y su fuente vive en FrankBetances/Valeria.
      # Una copia sin comprobación se desfasa: aquí se exige que el dibujo sea
      # el mismo píxel a píxel.
      - name: Verify Lúa matches Valeria+
        run: node scripts/check-lua-sprite.js

      # Una ilustración cuesta ancho × alto × 4 bytes de RAM en cuanto React
      # Native la descomprime, comprima como comprima el fichero. El banco se
      # generó una vez a 512×512 para dibujarse a 72–96 pt: 97 MB de bitmap de
      # los que dos tercios no llegaban a la pantalla. El gate impide que
      # vuelva a colarse un asset sobredimensionado — sobre todo el banco
      # definitivo del ilustrador, que entra por fuera del generador.
      - name: Verify illustration size budget
        run: node scripts/resize-verbal-images.js --check

      # Un icono mal encajado COMPILA: ni el typecheck, ni las suites, ni el
      # APK firmado ven que el dibujo se sale del círculo seguro de 66 dp y el
      # lanzador lo recorta. Pasó (4/9/2026: 73 dp de dibujo sobre 66 dp de
      # zona segura), así que se comprueba aquí, donde sí se mira el `res/`.
      - name: Verify launcher icons
        run: node scripts/build-launcher-icons.js --check

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.MYAPP_RELEASE_STORE_FILE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > android/app/viaplus-release.keystore

      # EL NDK NO VIENE EN LA IMAGEN DEL RUNNER: AGP lo detecta ausente en la
      # fase de CONFIGURACIÓN de Gradle y se lo descarga solo, en CADA ejecución,
      # metiendo un punto de fallo externo dentro del build.
      #
      # CUÁNTO CUESTA, MEDIDO (ejecución 145, 2/9/2026): 23 s en total —unos 7 s
      # de arranque de sdkmanager, ~2 s de descarga de android-ndk-r27b-linux y
      # ~10 s de descompresión—. Al escribir este paso se afirmó aquí que eran
      # «~600 MB y los ~3 min del codegen»: las dos cifras eran FALSAS y se
      # dieron sin medirlas. Los ~3 min del paso de abajo son suyos y siguen
      # igual con este paso puesto: son la descarga de gradle-8.14.1-bin.zip más
      # la compilación en Kotlin de los plugins de Expo y React Native, que es
      # justo lo que se lee en el log detrás de «Instalado.». Este paso NO
      # acelera el build, y no se puso para eso.
      #
      # Reventó en la ejecución 144, después de 143 seguidas en verde y sobre un
      # commit que solo tocaba cinco ficheros de `src/I18n/`, un `.md` y un
      # `.jpg`:
      #
      #   Preparing "Install NDK (Side by side) 27.1.12297006".
      #   Warning: ... Error on ZipFile unknown archive
      #   Caused by: java.util.zip.ZipException: Archive is not a ZIP archive
      #   > Failed to install: ndk;27.1.12297006
      #
      # Lo que bajó no era un ZIP. El build murió a los 2 min 19 s, en la
      # evaluación del proyecto raíz, sin haber compilado una línea — y el
      # mensaje («Install the missing components using the SDK manager in
      # Android Studio») manda a un sitio que en un runner no existe.
      #
      # Sacar la descarga FUERA de Gradle y ponerla aquí cambia tres cosas, y
      # ninguna es la velocidad:
      #   · se reintenta, que es lo único que cura una descarga corrupta;
      #   · falla en un paso con nombre propio, no dentro de un stacktrace de
      #     300 líneas de Gradle;
      #   · si algún día la imagen del runner ya trae el NDK, se salta sola.
      #
      # La versión NO se escribe aquí: se LEE de android/build.gradle, que es
      # donde se decide. Dos sitios con el mismo número se separan — es la misma
      # razón por la que la tabla de opcodes de Lúa se genera en vez de
      # copiarse.
      - name: Install Android NDK (with retry)
        run: |
          set -u
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          NDK=$(sed -n 's/.*ndkVersion[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' android/build.gradle | head -1)
          if [ -z "$NDK" ]; then
            echo "::error::No pude leer ndkVersion de android/build.gradle."
            exit 1
          fi
          echo "El proyecto pide ndk;$NDK · SDK en $SDK"

          if [ -d "$SDK/ndk/$NDK" ]; then
            echo "Ya presente en la imagen del runner: no hay nada que descargar."
            exit 0
          fi

          SDKMANAGER=""
          for c in "$SDK/cmdline-tools/latest/bin/sdkmanager" \
                   "$SDK/cmdline-tools/bin/sdkmanager" \
                   "$SDK/tools/bin/sdkmanager"; do
            [ -x "$c" ] && SDKMANAGER="$c" && break
          done
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::No encuentro sdkmanager bajo $SDK. Contenido de cmdline-tools:"
            ls -la "$SDK/cmdline-tools" 2>&1 || true
            exit 1
          fi

          for i in 1 2 3; do
            echo "--- Intento $i de instalar ndk;$NDK"
            if yes 2>/dev/null | "$SDKMANAGER" --sdk_root="$SDK" "ndk;$NDK"; then
              echo "Instalado."
              exit 0
            fi
            echo "Intento $i fallido. Borro la descarga a medias antes de reintentar."
            rm -rf "$SDK/ndk/$NDK" "$SDK/.temp" "$SDK/.downloadIntermediates"
            if [ "$i" -lt 3 ]; then sleep $((i * 20)); fi
          done

          echo "::error::No se pudo instalar ndk;$NDK tras 3 intentos. Si los tres fallan con"
          echo "::error::'Archive is not a ZIP archive', el problema está aguas arriba (dl.google.com)."
          exit 1

      - name: Pre-generate codegen artifacts for all native modules
        run: |
          cd android
          chmod +x gradlew
          ./gradlew generateCodegenArtifactsFromSchema --no-daemon

      - name: Build signed release APK and AAB
        env:
          MYAPP_VERSION_CODE: ${{ github.run_number }}
          MYAPP_RELEASE_STORE_FILE: viaplus-release.keystore
          MYAPP_RELEASE_STORE_PASSWORD: ${{ secrets.MYAPP_RELEASE_STORE_PASSWORD }}
          MYAPP_RELEASE_KEY_ALIAS: ${{ secrets.MYAPP_RELEASE_KEY_ALIAS }}
          MYAPP_RELEASE_KEY_PASSWORD: ${{ secrets.MYAPP_RELEASE_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease bundleRelease --no-daemon

      # Puerta de permisos. Se ejecuta sobre el manifiesto FUSIONADO, que es el
      # que viaja dentro del AAB: la duplicación que rechaza Play Console no la
      # produce nuestro manifiesto sino el merge con las dependencias, así que
      # revisar `src/main` no sirve de nada. Va antes de subir los artefactos
      # para que un bundle que la tienda va a rechazar no llegue a descargarse.
      - name: Verify merged manifest permissions
        run: node scripts/check-android-permissions.js

      - name: Verify AAB signature
        run: |
          jarsigner -verify android/app/build/outputs/bundle/release/app-release.aab

      - name: Remove keystore from runner
        if: always()
        run: rm -f android/app/viaplus-release.keystore

      # `retention-days: 7` no es una preferencia: es el máximo que admite este
      # repositorio (Settings → Actions → General → Artifact and log
      # retention). Antes decía 30 y GitHub lo recortaba a 7 en silencio, de
      # modo que el fichero afirmaba una cosa y la papelera hacía otra. Para
      # conservarlos más tiempo hay que subir PRIMERO el límite del repositorio;
      # cambiar solo este número no sirve de nada.
      #
      # Si algún día una entrega tiene que sobrevivir más allá de esa ventana,
      # el sitio de los binarios no es un artefacto sino un GitHub Release:
      # sus adjuntos no caducan.
      - name: Upload release APK
        if: env.IS_RELEASE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: viaplus-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 7

      - name: Upload release AAB
        if: env.IS_RELEASE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: viaplus-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 7

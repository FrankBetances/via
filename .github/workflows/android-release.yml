name: Android Release (APK + AAB)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - claude/github-workflows-android-signing-rlrk8f
    paths:
      - "android/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android-release.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install JS dependencies
        run: npm ci --legacy-peer-deps

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.MYAPP_RELEASE_STORE_FILE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > android/app/viaplus-release.keystore

      - name: Pre-generate codegen artifacts for all native modules
        run: |
          cd android
          chmod +x gradlew
          ./gradlew generateCodegenArtifactsFromSchema --no-daemon

      - name: Build signed release APK and AAB
        env:
          MYAPP_RELEASE_STORE_FILE: viaplus-release.keystore
          MYAPP_RELEASE_STORE_PASSWORD: ${{ secrets.MYAPP_RELEASE_STORE_PASSWORD }}
          MYAPP_RELEASE_KEY_ALIAS: ${{ secrets.MYAPP_RELEASE_KEY_ALIAS }}
          MYAPP_RELEASE_KEY_PASSWORD: ${{ secrets.MYAPP_RELEASE_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Verify AAB signature
        run: |
          jarsigner -verify android/app/build/outputs/bundle/release/app-release.aab

      - name: Remove keystore from runner
        if: always()
        run: rm -f android/app/viaplus-release.keystore

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: viaplus-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: viaplus-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

name: Android Release (APK + AAB)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "android/**"
      - "src/**"
      - "assets/audio/**"
      - "scripts/check-verbal-coverage.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android-release.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install JS dependencies
        run: npm ci --legacy-peer-deps

      # Puerta de locuciones. La síntesis en CI es TOLERANTE a propósito (una
      # voz que falle no debe tirar el lote de las demás), así que sin este
      # chequeo un idioma sin locutar viajaría hasta el APK sin que nadie se
      # entere: la audiometría verbal dictaría con la voz del dispositivo, que
      # no es el estímulo validado.
      #
      # No exige «todos los idiomas al 100 %», sino COHERENCIA con
      # `VERBAL_AUDIO_PENDING`, que es la declaración revisada de qué idiomas
      # se sabe que aún no tienen locuciones propias — y que la pantalla usa
      # para advertir al profesional. Falla en los dos sentidos: recortes que
      # faltan sin estar declarados, y declaraciones que se quedaron obsoletas
      # después de sintetizar.
      #
      # Va ANTES de descifrar el keystore: falla rápido y sin material sensible
      # en el runner.
      - name: Verify verbal clip coverage
        run: node scripts/check-verbal-coverage.js --strict

      # Lúa es de los dos productos y su fuente vive en FrankBetances/Valeria.
      # Una copia sin comprobación se desfasa: aquí se exige que el dibujo sea
      # el mismo píxel a píxel.
      - name: Verify Lúa matches Valeria+
        run: node scripts/check-lua-sprite.js

      # Una ilustración cuesta ancho × alto × 4 bytes de RAM en cuanto React
      # Native la descomprime, comprima como comprima el fichero. El banco se
      # generó una vez a 512×512 para dibujarse a 72–96 pt: 97 MB de bitmap de
      # los que dos tercios no llegaban a la pantalla. El gate impide que
      # vuelva a colarse un asset sobredimensionado — sobre todo el banco
      # definitivo del ilustrador, que entra por fuera del generador.
      - name: Verify illustration size budget
        run: node scripts/resize-verbal-images.js --check

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.MYAPP_RELEASE_STORE_FILE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > android/app/viaplus-release.keystore

      - name: Pre-generate codegen artifacts for all native modules
        run: |
          cd android
          chmod +x gradlew
          ./gradlew generateCodegenArtifactsFromSchema --no-daemon

      - name: Build signed release APK and AAB
        env:
          MYAPP_VERSION_CODE: ${{ github.run_number }}
          MYAPP_RELEASE_STORE_FILE: viaplus-release.keystore
          MYAPP_RELEASE_STORE_PASSWORD: ${{ secrets.MYAPP_RELEASE_STORE_PASSWORD }}
          MYAPP_RELEASE_KEY_ALIAS: ${{ secrets.MYAPP_RELEASE_KEY_ALIAS }}
          MYAPP_RELEASE_KEY_PASSWORD: ${{ secrets.MYAPP_RELEASE_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease bundleRelease --no-daemon

      # Puerta de permisos. Se ejecuta sobre el manifiesto FUSIONADO, que es el
      # que viaja dentro del AAB: la duplicación que rechaza Play Console no la
      # produce nuestro manifiesto sino el merge con las dependencias, así que
      # revisar `src/main` no sirve de nada. Va antes de subir los artefactos
      # para que un bundle que la tienda va a rechazar no llegue a descargarse.
      - name: Verify merged manifest permissions
        run: node scripts/check-android-permissions.js

      - name: Verify AAB signature
        run: |
          jarsigner -verify android/app/build/outputs/bundle/release/app-release.aab

      - name: Remove keystore from runner
        if: always()
        run: rm -f android/app/viaplus-release.keystore

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: viaplus-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: viaplus-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
// Firebase (Auth/Firestore): el plugin exige android/app/google-services.json.
// Se aplica condicionalmente para no romper el build mientras el archivo no
// esté registrado; sin él, Firebase no se inicializa en runtime.
if (file('google-services.json').exists()) {
    apply plugin: "com.google.gms.google-services"
} else {
    logger.warn("VIA+: falta android/app/google-services.json — Firebase quedará sin inicializar en este build.")
}

/* -------------------------------------------------------------------------- *
 *  Órdenes de `node` que necesita el bloque `react { }` de aquí abajo.
 *
 *  `install-expo-modules` las dejó escritas con el patrón de Groovy
 *  `[...].execute(...).text`, y ese patrón tiene dos fallos conocidos que se
 *  pagan EN EL BUILD, no aquí:
 *
 *   1. `.text` lee SOLO la salida estándar. El error estándar del proceso hijo
 *      no lo consume nadie, así que en cuanto `node` escribe más de lo que cabe
 *      en el buffer de la tubería (64 KB en Linux: un aviso de obsolescencia,
 *      un shim de nvm o corepack, una traza) el hijo se BLOQUEA escribiendo y
 *      Gradle se bloquea leyendo. El build se queda parado para siempre en la
 *      fase de configuración, sin mensaje, sin tarea a la que señalar y sin
 *      nada que mirar en el registro.
 *   2. No se comprueba el código de salida. Si `node` no está en el PATH —el
 *      caso corriente cuando Android Studio se abre desde el escritorio y no
 *      hereda el PATH del intérprete de órdenes— la salida vuelve vacía y el
 *      build continúa con `entryFile` apuntando a la nada.
 *
 *  Este ayudante drena las DOS salidas, pone un plazo y, si algo falla, lo
 *  dice: qué orden era, con qué código salió y qué escribió por el error
 *  estándar. Regla 4 del CLAUDE.md aplicada al build: no basta con no
 *  romperse; hay que poder saber qué pasó.
 * -------------------------------------------------------------------------- */
def nodeOutput = { List<String> command, String what ->
    def out = new StringBuffer()
    def err = new StringBuffer()
    def proc = command.execute(null, rootDir)
    proc.consumeProcessOutput(out, err)
    proc.waitForOrKill(120000)
    def value = out.toString().trim()
    if (proc.exitValue() != 0 || value.isEmpty()) {
        throw new GradleException(
            "VIA+: no se pudo resolver " + what + ".\n" +
            "  orden  : " + command.join(" ") + "\n" +
            "  codigo : " + proc.exitValue() + "\n" +
            "  stderr : " + err.toString().trim() + "\n" +
            "Si el que falta es `node`, abre Android Studio desde una terminal " +
            "con el PATH cargado (o declara node en el entorno del demonio de Gradle)."
        )
    }
    return value
}

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
    //
    // Added by install-expo-modules
    entryFile = file(nodeOutput(["node", "-e", "require('expo/scripts/resolveAppEntry')", rootDir.getAbsoluteFile().getParentFile().getAbsolutePath(), "android", "absolute"], "el punto de entrada de la app (expo/scripts/resolveAppEntry)"))
    cliFile = new File(nodeOutput(["node", "--print", "require.resolve('@expo/cli')"], "el CLI de Expo (@expo/cli)"))
    bundleCommand = "export:embed"
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

def ksProps = new Properties()
def ksFile = rootProject.file('keystore.properties')
if (ksFile.exists()) { ksProps.load(new FileInputStream(ksFile)) }

// En CI el versionCode viene del número de run de GitHub Actions
// (MYAPP_VERSION_CODE), garantizando que cada build subido a Play
// Console sea estrictamente mayor que el anterior. En builds locales
// se usa 1: los .aab locales no se suben a la tienda.
def appVersionCode = (System.getenv('MYAPP_VERSION_CODE') ?: '1').toInteger()

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "eu.futureforkids.via"
    defaultConfig {
        applicationId "eu.futureforkids.via"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName "1.0"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            storeFile file(ksProps['storeFile'] ?: System.getenv('MYAPP_RELEASE_STORE_FILE') ?: 'debug.keystore')
            storePassword(ksProps['storePassword'] ?: System.getenv('MYAPP_RELEASE_STORE_PASSWORD') ?: 'android')
            keyAlias(ksProps['keyAlias'] ?: System.getenv('MYAPP_RELEASE_KEY_ALIAS') ?: 'androiddebugkey')
            keyPassword(ksProps['keyPassword'] ?: System.getenv('MYAPP_RELEASE_KEY_PASSWORD') ?: 'android')
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

configurations.all {
    // El proyecto está 100% en AndroidX (android.useAndroidX=true) pero Jetifier
    // ya no está disponible en AGP moderno: alguna dependencia transitiva sigue
    // resolviendo el grupo legado `com.android.support`, que duplica clases ya
    // provistas por androidx.core (p.ej. android.support.v4.app.INotificationSideChannel).
    exclude group: "com.android.support"
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

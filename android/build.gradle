buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        /* 36 (Android 16) por el mismo criterio que `kotlinVersion` de abajo:
         * es el que trae la versión de React Native que el proyecto usa
         * (node_modules/react-native/gradle/libs.versions.toml:4,
         * `targetSdk = "36"`, con agp = "8.11.0" y compileSdk = "36"). No es un
         * número elegido aquí.
         *
         * Estaba en 35 y Google Play RECHAZÓ la subida a pruebas internas el
         * 5/9/2026: «tu aplicación está orientada al nivel 35 de la API, pero
         * debe orientarse, al menos, al nivel 36». `compileSdkVersion` y
         * `buildToolsVersion` ya estaban en 36, así que la cadena de
         * herramientas no cambia: lo que cambia es el COMPORTAMIENTO en
         * ejecución sobre Android 16.
         *
         * Comprobado en el árbol antes de subirlo, porque los dos cambios de
         * Android 16 que rompen apps dependen de banderas que este manifiesto
         * no declara:
         *   · edge-to-edge sin opt-out — no se usa
         *     `windowOptOutEdgeToEdgeEnforcement` (ni en el manifiesto ni en
         *     los temas), y con target 35 la app ya iba edge-to-edge;
         *   · orientación y redimensionado libres en pantallas ≥ 600 dp — no se
         *     declara `screenOrientation` ni `resizeableActivity` en ningún
         *     sitio, y `MainActivity` ya trae `configChanges` con `orientation`
         *     y `screenSize`.
         * Lo que NO se ha comprobado: cómo se ve en un dispositivo con Android
         * 16. Aquí no hay SDK de Android ni emulador. */
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        /* Kotlin 2.1.20 es la versión con la que compila React Native 0.81.5
         * (node_modules/@react-native/gradle-plugin/gradle/libs.versions.toml:
         * kotlin = "2.1.20"), y está en la lista que admite el plugin
         * `expo-root-project`.
         *
         * Estaba en 1.9.25 y el build MURIÓ en cuanto se añadió Expo:
         *   > Failed to apply plugin 'expo-root-project'.
         *      > Can't find KSP version for Kotlin version '1.9.25'.
         *        Supported versions are: 2.2.20 … 2.1.20 … 2.0.0
         * No se elige un número «que suene bien»: se toma el que trae la propia
         * versión de React Native que el proyecto usa. */
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        // Procesa android/app/google-services.json para Firebase (Auth/Firestore).
        classpath("com.google.gms:google-services:4.4.3")
    }
}

apply plugin: "com.facebook.react.rootproject"

// Fuerza jvmTarget=17 en todos los módulos Kotlin (RN 0.81 compila Java 17).
// Se usa `plugins.withId` en lugar de `afterEvaluate`: el patrón
// `subprojects { afterEvaluate {} }` fallaba con "Cannot run afterEvaluate when
// the project is already evaluated" porque el plugin de RN evalúa `:app` de
// forma temprana. `plugins.withId` se dispara al aplicarse el plugin, sin
// depender del estado de evaluación. (Versión validada en CI.)
subprojects { subproject ->
    ["kotlin-android", "org.jetbrains.kotlin.android"].each { pluginId ->
        subproject.plugins.withId(pluginId) {
            subproject.android.kotlinOptions {
                jvmTarget = "17"
            }
        }
    }
}
/* Añadido por `install-expo-modules`. Aplica, entre otras cosas, KSP, que
 * exige una versión de Kotlin soportada: si `kotlinVersion` (arriba) no está en
 * su lista, el build falla al EVALUAR el proyecto raíz, antes de compilar nada.
 * Es lo que rompió todos los builds del 22 y 23 de agosto de 2026. */
apply plugin: "expo-root-project"

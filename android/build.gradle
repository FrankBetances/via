buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 35
        ndkVersion = "27.1.12297006"
        kotlinVersion = "1.9.25"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

subprojects { subproject ->
    // `plugins.withId` se dispara en cuanto el plugin se aplica (ya sea antes o
    // después de este punto), sin depender de `afterEvaluate`. El plugin de RN
    // (`com.facebook.react.rootproject`) evalúa `:app` de forma temprana, lo que
    // hacía fallar `afterEvaluate` con "project is already evaluated".
    ["kotlin-android", "org.jetbrains.kotlin.android"].each { pluginId ->
        subproject.plugins.withId(pluginId) {
            subproject.android.kotlinOptions {
                jvmTarget = "17"
            }
        }
    }
}

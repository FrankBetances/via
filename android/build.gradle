buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 35
        ndkVersion = "27.1.12297006"
        kotlinVersion = "1.9.25"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        // Procesa android/app/google-services.json para Firebase (Auth/Firestore).
        classpath("com.google.gms:google-services:4.4.3")
    }
}

apply plugin: "com.facebook.react.rootproject"

// Fuerza jvmTarget=17 en todos los módulos Kotlin (RN 0.80 compila Java 17).
// Se usa `plugins.withId` en lugar de `afterEvaluate`: el patrón
// `subprojects { afterEvaluate {} }` fallaba con "Cannot run afterEvaluate when
// the project is already evaluated" porque el plugin de RN evalúa `:app` de
// forma temprana. `plugins.withId` se dispara al aplicarse el plugin, sin
// depender del estado de evaluación. (Versión validada en CI.)
subprojects { subproject ->
    ["kotlin-android", "org.jetbrains.kotlin.android"].each { pluginId ->
        subproject.plugins.withId(pluginId) {
            subproject.android.kotlinOptions {
                jvmTarget = "17"
            }
        }
    }
}
